<main>
  <section>
    <h2>Buku Tamu</h2>
    <form id="formTamu" action="hasil.html" method="get" novalidate>
      <label for="nm">Nama Lengkap <span class="wajib">*</span></label>
      <input type="text" id="nm" name="nm_lengkap031" maxlength="50">
      <div class="err" id="e_nm"></div>

      <label for="em">Email <span class="wajib">*</span></label>
      <input type="email" id="em" name="email031" maxlength="50">
      <div class="err" id="e_em"></div>

      <label for="as">Asal / Instansi</label>
      <input type="text" id="as" name="asal_instansi123" maxlength="50">

      <label for="sb">Subjek</label>
      <input type="text" id="sb" name="subjek031" maxlength="50">

      <label for="ps">Pesan / Komentar <span class="wajib">*</span></label>
      <textarea id="ps" name="pesan031" rows="4" maxlength="200"></textarea>
      <div class="err" id="e_ps"></div>

      <label for="tg">Tanggal Kunjungan</label>
      <input type="date" id="tg" name="tgl_kunjungan031">

      <button class="btn" type="submit">Kirim</button>
    </form>
  </section>
